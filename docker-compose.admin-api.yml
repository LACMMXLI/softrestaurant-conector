services:
  api:
    build:
      context: .
      dockerfile: central-api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-restaurant_agent_reports};Username=${POSTGRES_USER:-restaurant_agent};Password=${SERVICE_PASSWORD_64_POSTGRES:?Coolify debe generar SERVICE_PASSWORD_64_POSTGRES}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - restaurant-agent-central

networks:
  restaurant-agent-central:
    external: true
    name: ptwwtbojndstouzkkvo3xtz0
