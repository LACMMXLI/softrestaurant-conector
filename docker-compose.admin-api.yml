services:
  admin-api:
    build:
      context: .
      dockerfile: central-api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-restaurant-agent_reports};Username=${POSTGRES_USER:-restaurant-agent};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      CONNECTOR_ADMIN_KEY: ${CONNECTOR_ADMIN_KEY:?Define CONNECTOR_ADMIN_KEY}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - restaurant-agent-central

networks:
  restaurant-agent-central:
    external: true
    name: ptwwtbojndstouzkkvo3xtz0
