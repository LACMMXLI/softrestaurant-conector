services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: softrestaurant_reports
      POSTGRES_USER: softrestaurant
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - softrestaurant_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softrestaurant -d softrestaurant_reports"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
        WORKDIR /src
        RUN mkdir -p /src/central-api /src/sync-contracts
        RUN echo '' | base64 -d > '/src/central-api/SoftRestaurant.CentralApi.csproj'
        RUN echo '' | base64 -d > '/src/central-api/ApiOptions.cs'
        RUN echo '' | base64 -d > '/src/central-api/TokenHasher.cs'
        RUN echo '' | base64 -d > '/src/central-api/DbInitializer.cs'
        RUN echo '' | base64 -d > '/src/central-api/AgentAuthenticator.cs'
        RUN echo '' | base64 -d > '/src/central-api/ConnectorRegistry.cs'
        RUN echo '' | base64 -d > '/src/central-api/BatchIngestor.cs'
        RUN echo '' | base64 -d > '/src/central-api/Program.cs'
        RUN echo '' | base64 -d > '/src/central-api/schema.sql'
        RUN echo 'PFByb2plY3QgU2RrPSJNaWNyb3NvZnQuTkVULlNkayI+CgogIDxQcm9wZXJ0eUdyb3VwPgogICAgPFRhcmdldEZyYW1ld29yaz5uZXQ4LjA8L1RhcmdldEZyYW1ld29yaz4KICAgIDxJbXBsaWNpdFVzaW5ncz5lbmFibGU8L0ltcGxpY2l0VXNpbmdzPgogICAgPE51bGxhYmxlPmVuYWJsZTwvTnVsbGFibGU+CiAgPC9Qcm9wZXJ0eUdyb3VwPgoKPC9Qcm9qZWN0Pgo=' | base64 -d > '/src/sync-contracts/SoftRestaurant.Sync.Contracts.csproj'
        RUN echo '' | base64 -d > '/src/sync-contracts/Contracts.cs'
        RUN echo '' | base64 -d > '/src/sync-contracts/SyncBatch.cs'
        RUN dotnet restore /src/central-api/SoftRestaurant.CentralApi.csproj
        RUN dotnet publish /src/central-api/SoftRestaurant.CentralApi.csproj -c Release -o /app/publish --no-restore
        FROM mcr.microsoft.com/dotnet/aspnet:8.0 AS runtime
        WORKDIR /app
        RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
        COPY --from=build /app/publish .
        ENV ASPNETCORE_URLS=http://+:8080
        EXPOSE 8080
        ENTRYPOINT ["dotnet", "SoftRestaurant.CentralApi.dll"]
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=softrestaurant_reports;Username=softrestaurant;Password=${SERVICE_PASSWORD_64_POSTGRES}"
      CONNECTOR_ADMIN_KEY: ${SERVICE_PASSWORD_64_CONNECTOR_ADMIN}
      BOOTSTRAP_BRANCH_CODE: sucursal-piloto
      BOOTSTRAP_BRANCH_NAME: Sucursal piloto
      LEGACY_BOOTSTRAP_AGENT_TOKEN: ${SERVICE_PASSWORD_64_AGENT}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  softrestaurant_postgres_data:
