services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-softrestaurant_reports}
      POSTGRES_USER: ${POSTGRES_USER:-softrestaurant}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?Coolify debe generar SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - softrestaurant_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: central-api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-softrestaurant_reports};Username=${POSTGRES_USER:-softrestaurant};Password=${SERVICE_PASSWORD_64_POSTGRES}
      CONNECTOR_ADMIN_KEY: ${SERVICE_PASSWORD_64_CONNECTOR_ADMIN:?Coolify debe generar SERVICE_PASSWORD_64_CONNECTOR_ADMIN}
      BOOTSTRAP_BRANCH_CODE: ${BOOTSTRAP_BRANCH_CODE:-sucursal-piloto}
      BOOTSTRAP_BRANCH_NAME: ${BOOTSTRAP_BRANCH_NAME:-Sucursal piloto}
      LEGACY_BOOTSTRAP_AGENT_TOKEN: ${SERVICE_PASSWORD_64_AGENT:-}
      DASHBOARD_OWNER_EMAIL: ${DASHBOARD_OWNER_EMAIL:?Define DASHBOARD_OWNER_EMAIL}
      DASHBOARD_OWNER_PASSWORD: ${SERVICE_PASSWORD_64_DASHBOARD_OWNER:?Coolify debe generar SERVICE_PASSWORD_64_DASHBOARD_OWNER}
      DASHBOARD_SESSION_HOURS: ${DASHBOARD_SESSION_HOURS:-24}
      DASHBOARD_STALE_MINUTES: ${DASHBOARD_STALE_MINUTES:-10}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: dashboard-web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  softrestaurant_postgres_data:
